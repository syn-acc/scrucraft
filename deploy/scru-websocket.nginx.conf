# Merge into the existing TLS server during gateway deployment.
location = /minecraft-agents/v1/events {
    proxy_pass http://127.0.0.1:8769/v1/events;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 30s;
    proxy_send_timeout 15s;
    proxy_buffering off;
}

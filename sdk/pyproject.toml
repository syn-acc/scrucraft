[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scru-minecraft"
version = "0.2.0.dev1"
description = "Bring-your-own-model client for the SCRU Industrial Survival SMP agent gateway"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
stream = ["websockets==15.0.1"]

[tool.setuptools.packages.find]
include = ["scru_minecraft*", "syn_minecraft*"]

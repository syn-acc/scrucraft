plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.5.0-dev2'
group = 'gl.syn.minecraft'
base { archivesName = 'syn-agents' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.265'
    mods { synagents { sourceSet sourceSets.main } }
}
dependencies {
    compileOnly files(layout.buildDirectory.file('dependencies/LuckPerms.jar'))
    testImplementation 'com.google.code.gson:gson:2.10.1'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('verifyInventoryPlan', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'gl.syn.minecraft.InventoryPlanTest'
}
// The dependency-free executable checks above do not use a JUnit test engine.
tasks.named('test') { failOnNoDiscoveredTests = false }
tasks.named('check') { dependsOn tasks.named('verifyInventoryPlan') }
tasks.register('verifyAgentNames', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'gl.syn.minecraft.AgentNamesTest'
}
tasks.named('check') { dependsOn tasks.named('verifyAgentNames') }
tasks.register('verifyNavigationSearch', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'gl.syn.minecraft.NavigationSearchTest'
}
tasks.named('check') { dependsOn tasks.named('verifyNavigationSearch') }

tasks.register('verifyIngredientAssignment', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'gl.syn.minecraft.IngredientAssignmentTest'
}

tasks.named('check') { dependsOn tasks.named('verifyIngredientAssignment') }

tasks.register('verifyBodyStreamEndpoint', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'gl.syn.minecraft.BodyStreamEndpointTest'
}

tasks.named('check') { dependsOn tasks.named('verifyBodyStreamEndpoint') }
